# Production nginx config for the Telehealth Platform frontend (Vite SPA)
# Place this at /etc/nginx/sites-enabled/telehealth or use as the image's default.conf

# Redirect all HTTP → HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name app.telehealth.eu;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name app.telehealth.eu;

    root /usr/share/nginx/html;
    index index.html;

    # ── TLS ──────────────────────────────────────────────────────────────────
    ssl_certificate     /etc/ssl/certs/telehealth.crt;
    ssl_certificate_key /etc/ssl/private/telehealth.key;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # OCSP stapling
    ssl_stapling        on;
    ssl_stapling_verify on;
    resolver            1.1.1.1 1.0.0.1 valid=300s;

    # ── Security headers ─────────────────────────────────────────────────────
    add_header Strict-Transport-Security  "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options            "DENY" always;
    add_header X-Content-Type-Options     "nosniff" always;
    add_header Referrer-Policy            "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy         "camera=(self), microphone=(self), geolocation=(), payment=(), usb=(), display-capture=(self)" always;

    # CSP: allow self-hosted assets + LiveKit WebSocket + MUI inline styles
    add_header Content-Security-Policy
        "default-src 'self'; "
        "script-src 'self'; "
        "style-src 'self' 'unsafe-inline'; "
        "img-src 'self' data: blob: https:; "
        "font-src 'self'; "
        "connect-src 'self' wss: https://api.telehealth.eu https://my.staging.dosespot.com; "
        "media-src 'self' blob:; "
        "worker-src 'self' blob:; "
        "frame-ancestors 'none'; "
        "base-uri 'self'; "
        "form-action 'self'"
        always;

    # Remove server fingerprint
    server_tokens off;
    more_clear_headers Server;

    # ── Gzip ─────────────────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript
               application/xml+rss application/atom+xml image/svg+xml;

    # ── Cache static assets (Vite content-hashed filenames) ──────────────────
    location ~* \.(?:js|css|woff2?|ttf|eot|svg|ico|png|webp|jpg|jpeg|gif|avif)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        # Re-apply security headers (nginx only inherits them in the server block)
        add_header X-Content-Type-Options "nosniff" always;
    }

    # ── PWA manifest + service worker — no cache ─────────────────────────────
    location ~* \.(?:webmanifest|json)$ {
        add_header Cache-Control "no-cache";
    }

    # ── SPA fallback ─────────────────────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # ── Block common attack probes ────────────────────────────────────────────
    location ~* \.(php|asp|aspx|jsp|cgi)$ {
        return 404;
    }

    location ~ /\. {
        deny all;
        access_log off;
    }
}
